name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker service
        run: |
          sudo systemctl start docker
          sudo systemctl enable docker
          sleep 20
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: crcustomercompliantalertdemoeastus001.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t crcustomercompliantalertdemoeastus001.azurecr.io/customercompliantalert:${{ github.sha }} .
          docker push crcustomercompliantalertdemoeastus001.azurecr.io/customercompliantalert:${{ github.sha }}

      - name: Log out from Azure Container Registry
        run: docker logout crcustomercompliantalertdemoeastus001.azurecr.io