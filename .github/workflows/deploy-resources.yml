name: Deploy Azure Resources

on:
  push:
  workflow_dispatch:
      
# Require write permission to Fetch an OIDC token.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Creating Azure Resources
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          resourceGroupName: rg-cca-demo-eastus-001
          template: ./infra/main.bicep
          parameters: ./infra/main.bicepparam